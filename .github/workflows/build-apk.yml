name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

steps:
      - name: Checkout repository
        uses: actions/checkout@v4

- name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

- name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json || true
          cp sw.js www/sw.js || true
          cp icon-192.png www/icon-192.png || true
          cp icon-512.png www/icon-512.png || true

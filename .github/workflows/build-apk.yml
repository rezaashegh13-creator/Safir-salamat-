name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

- name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

- name: آمادهسازی فایلهای وب
        run: |
          mkdir -p www
          cp -r ./* www/ || true

- name: نصب Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

- name: ساخت پروژه Capacitor
        run: |
          npx cap init "Safir Salamat Hami" "com.safir.salamat" --web-dir=www
          npx cap add android
          npx cap sync android

- name: ساخت APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

- name: آمادهسازی APK برای دانلود
        uses: actions/upload-artifact@v4
        with:
          name: safir-salamat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

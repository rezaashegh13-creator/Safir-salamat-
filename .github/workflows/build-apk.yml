name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

- name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

- name: آمادهسازی فایلهای وب
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp icon-192.png www/ 2>/dev/null || true
          cp icon-512.png www/ 2>/dev/null || true

- name: نصب Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

- name: ساخت پروژه Capacitor
        run: |
          npx cap init "سفیر سلامت حامی" "com.safir.salamat.hami" --web-dir www
          npx cap add android
          npx cap copy

- name: ساخت APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

- name: دریافت APK
        uses: actions/upload-artifact@v4
        with:
          name: safir-salamat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
